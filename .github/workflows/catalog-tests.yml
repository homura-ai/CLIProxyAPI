name: catalog-tests
on:
  pull_request:
    paths: ['pbox/*catalog*', '.github/workflows/catalog-tests.yml']
  push:
    branches: [automation]
    paths: ['pbox/*catalog*', '.github/workflows/catalog-tests.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 pbox/test_codex_catalog.py
